<!DOCTYPE html>
<html>
<head>

<style type="text/css">

	background-image: url(../images/background.jpg);
}

html, body, #wrapper {
      height:100%;
	  width: 100%;
      margin: 0;
      padding: 0;
      border: none;
	  white-space:0;
   }
   
.style1 {color: #FFFFFF; font-weight: bold; font-family: Tahoma; font-size: 15px; }

.style2 {color: #00F; font-weight: bold;  font-family: Tahoma; font-size: 15px; }

.style3 {color: #00F; font-family: Tahoma; font-size: 12px;}

.style4 {color: #00F; font-weight: bold; font-family: Tahoma; font-size: 13px;}

a:link {
COLOR: #FFFFFF;
text-decoration:none;
}
a:visited {
COLOR: #FFFFFF;
}
a:hover {
COLOR: #FFFFFF;
}
a:active {
COLOR: #FFFFFF;
}
</style>

<!-- InstanceBeginEditable name="head" -->
<!-- InstanceEndEditable -->
<script type="text/javascript" src="../ControlsList/Util.js"></script>
<script type="text/javascript">
    function showmessage() {
        var str = getControlByIDAndShadowContext("select").value;
        var delay = getControlByIDAndShadowContext("ipDelay").value;
        setTimeout(() => {
            if (str == "showAlert") {
                window.alert("This is an alert message.");
            }
            else if (str == "showPrompt") {
                window.prompt("This is a Prompt Message:", "");
            }
            else {
                window.confirm("This is a Comfirm Message.");
            }
        }, parseInt(delay));
    }
	
	function changeTitle() 
	{
		var sTitle = document.title;
		parent.postMessage(sTitle,"*");
	}

</script>
</head>
<!-- InstanceBeginEditable name="doctitle" -->
<title>Layout Controls</title>
<!-- InstanceEndEditable -->
<body onload="changeTitle()">

<td width="24%" height="70%" rowspan="4"></td>
</tr>

<tr>
  <td colspan="2" valign="bottom" height="4%">
    <!-- InstanceBeginEditable name="Row1" -->

    </span>
    <!-- InstanceEndEditable --></td>
</tr>

<tr>
	<td colspan="2" valign="top"height="53%"><!-- InstanceBeginEditable name="Row2" -->
		<table width="100%" height="100%">

				<tr>

                            <select id="select" style=" width:150px;" >

		</td>
